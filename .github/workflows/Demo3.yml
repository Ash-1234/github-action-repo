name: DEMO3

# Controls when the workflow will run
on:
  [push,workflow_dispatch]
    

# A workflow run is made up of one or more jobs
jobs:
  first-job:
     runs-on: ubuntu-latest
     
     steps:
      - name: firstjob
        run: echo "hello world"
  second-job:
     runs-on: ubuntu-latest
     needs: first-job
     if: ${{always()}}
     steps:
      - name: secondjob
        run: echo "second world"
  third-job:
     runs-on: ubuntu-latest
     needs: second-job
     if: ${{always()}}
     steps:
      - name: third job
        run: echo "third world"